<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="340" viewBox="0 0 1240 340" role="img" aria-labelledby="title desc">
  <title id="title">VisionBot data flow</title>
  <desc id="desc">Webcam or video feeds YOLOv8 and ByteTrack, then a 2D Kalman filter, then the controller and 10 Hz watchdog, then Gazebo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#38bdf8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1240" height="340" fill="url(#bg)"/>
  <text x="40" y="52" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">VisionBot · perception → control → simulation</text>
  <text x="40" y="80" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Latest-frame capture · YOLOv8 + ByteTrack · 2D Kalman smoothing · 60 Hz cmd_vel · 10 Hz safety watchdog</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g filter="url(#shadow)">
      <rect x="40" y="130" width="190" height="108" rx="16" fill="#1d4ed8"/>
      <text x="135" y="172" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">Webcam / Video</text>
      <text x="135" y="198" text-anchor="middle" fill="#dbeafe" font-size="13">camera_index or</text>
      <text x="135" y="216" text-anchor="middle" fill="#dbeafe" font-size="13">camera_source</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="290" y="118" width="220" height="132" rx="16" fill="#0f766e"/>
      <text x="400" y="158" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">YOLOv8 + ByteTrack</text>
      <text x="400" y="184" text-anchor="middle" fill="#ccfbf1" font-size="13">imgsz=320 · FP16 on CUDA</text>
      <text x="400" y="204" text-anchor="middle" fill="#ccfbf1" font-size="13">stable track IDs</text>
      <text x="400" y="224" text-anchor="middle" fill="#ccfbf1" font-size="13">/perception/annotated</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="570" y="118" width="210" height="132" rx="16" fill="#7c3aed"/>
      <text x="675" y="158" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">2D Kalman Filter</text>
      <text x="675" y="184" text-anchor="middle" fill="#ede9fe" font-size="13">state [x, y, vx, vy]</text>
      <text x="675" y="204" text-anchor="middle" fill="#ede9fe" font-size="13">jitter smoothing</text>
      <text x="675" y="224" text-anchor="middle" fill="#ede9fe" font-size="13">15-frame occlusion coast</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="840" y="118" width="210" height="132" rx="16" fill="#b45309"/>
      <text x="945" y="156" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Controller</text>
      <text x="945" y="181" text-anchor="middle" fill="#fef3c7" font-size="13">angular P-control</text>
      <text x="945" y="201" text-anchor="middle" fill="#fef3c7" font-size="13">distance hold + deadband</text>
      <text x="945" y="221" text-anchor="middle" fill="#fef3c7" font-size="13">60 Hz TwistStamped</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1100" y="118" width="110" height="132" rx="16" fill="#0369a1"/>
      <text x="1155" y="163" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Gazebo</text>
      <text x="1155" y="190" text-anchor="middle" fill="#e0f2fe" font-size="13">TurtleBot3</text>
      <text x="1155" y="210" text-anchor="middle" fill="#e0f2fe" font-size="13">Burger</text>
    </g>
  </g>

  <g stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M230 184 H286"/>
    <path d="M510 184 H566"/>
    <path d="M780 184 H836"/>
    <path d="M1050 184 H1096"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#7dd3fc">
    <text x="232" y="174">frame</text>
    <text x="512" y="174">/target/pose</text>
    <text x="776" y="174">smoothed x/y</text>
    <text x="1044" y="174">/cmd_vel</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="840" y="270" width="370" height="42" rx="10" fill="#7f1d1d" opacity="0.95"/>
    <text x="1025" y="296" text-anchor="middle" fill="#fecaca" font-size="13" font-weight="600">10 Hz watchdog → zero Twist on target loss</text>
    <text x="40" y="296" fill="#94a3b8" font-size="13">mocked-hardware unit tests · Dockerized CI · Apache-2.0</text>
  </g>
</svg>
