# Visual Teleoperation Parameters
# All parameters loaded via declare_parameter in nodes

# --- Perception Node Parameters ---
perception_node:
  ros__parameters:
    # Camera settings
    camera_index: 0                    # Video device index (/dev/videoX)
    camera_source: ""                  # Optional video file path (e.g. "demo.mp4"); overrides index
    camera_width: 640                  # Capture width
    camera_height: 480                 # Capture height
    camera_fps: 30                     # Capture FPS
    camera_backend: "v4l2"             # Backend: v4l2 (required for webcam access in WSL2)
    camera_fourcc: "MJPG"              # FourCC format: MJPG (YUYV produces corrupted frames in this env)
    camera_warmup_frames: 10           # Frames to discard for auto-exposure/white-balance settle
    camera_capture_threaded: true      # Latest-frame grabber (false = synchronous read in timer)

    # YOLO settings
    yolo_model: "yolov8n.pt"           # YOLO model file (downloaded auto)
    target_class: "person"             # COCO class name to track
    confidence_threshold: 0.5          # Detection confidence threshold
    iou_threshold: 0.45                # NMS IoU threshold
    device: "auto"                     # auto -> cuda:0 if available, else cpu
    yolo_imgsz: 320                    # Inference resolution (256/320 are good latency/accuracy tradeoffs)
    yolo_half: true                    # FP16 on CUDA; automatically disabled on CPU
    yolo_max_det: 20                   # Cap detections before NMS
    inference_poll_rate_hz: 60.0       # Poll for newest frame faster than the 30 FPS camera

    # ByteTrack settings
    track_activation_threshold: 0.25   # Confidence threshold for activating new tracks
    minimum_matching_threshold: 0.8    # IoU threshold for matching detections to tracks
    max_time_lost: 30                  # Max frames to keep lost track alive
    minimum_consecutive_frames: 1      # Min consecutive frames to confirm a track

    # Smoothing filter
    smoothing_method: "kalman"         # kalman (default), moving_average, or none
    smoothing_window_size: 5           # Moving-average fallback window (0=disabled)

    # Constant-velocity Kalman filter (pure NumPy)
    kalman_process_noise: 0.1          # White-acceleration q: higher = more responsive, less smooth
    kalman_measurement_noise: 0.002    # Measurement variance r: higher = more smoothing
    kalman_initial_covariance: 1.0     # Initial uncertainty for x, y, vx, vy
    kalman_coast_frames: 15            # Predict-only frames during occlusion (~0.5 s at 30 Hz, below 1 s watchdog)

    # Output
    publish_annotated_image: true      # Publish /perception/annotated image
    publish_rate_hz: 30.0              # Hz

# --- Controller Node Parameters ---
controller_node:
  ros__parameters:
    # Control gains
    linear_gain: 0.5                   # Proportional gain for linear velocity
    angular_gain: 1.0                  # Proportional gain for angular velocity

    # Speed limits (TurtleBot3 Waffle max: 0.26 m/s linear, 1.82 rad/s angular)
    max_linear_speed: 0.22             # m/s
    max_angular_speed: 1.82            # rad/s

    # Target following behavior
    target_distance: 1.0               # Desired distance from target (meters)
    deadband: 0.1                      # Distance deadband (meters)
    dead_zone_px: 0.05                 # Dead zone in normalized x (0-1) for angular control

    # Safety
    target_lost_timeout_sec: 1.0       # Seconds before stopping if target lost (used by both callback and watchdog)
    enable_safety_stop: true           # Stop robot if no target detected

    # Output
    publish_rate_hz: 60.0              # Hz - dispatch cmd_vel faster than perception updates